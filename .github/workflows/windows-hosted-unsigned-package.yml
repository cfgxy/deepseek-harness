name: Package Desktop · Windows · x64 · hosted unsigned

on:
  workflow_call:
    inputs:
      source_ref:
        description: '打包源码分支或 dsh-v* tag；只构建内部测试 unsigned 安装包'
        type: string
        required: true
      build_version:
        description: '可选构建版本；留空使用源码产品版本'
        type: string
        default: ''
        required: false
      signing:
        description: '只能是 unsigned；禁止由 GitHub-hosted job 请求签名'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-hosted-unsigned-desktop-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
      PACKAGE_SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Reject signing or publication requests
        env:
          PACKAGE_SIGNING: ${{ inputs.signing }}
        run: |
          if ($env:PACKAGE_SIGNING -ne 'unsigned') { throw 'Hosted packaging only accepts unsigned installers' }
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve build version
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
        run: |
          $product = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $version = $env:PACKAGE_BUILD_VERSION.Trim()
          if (-not $version) { $version = $product }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Check hosted unsigned packaging configuration and toolchain
        run: pnpm run package:desktop:win:x64 -- --check --unsigned --hosted-unsigned --build-version ${{ steps.settings.outputs.version }}
      - name: Build unsigned installer and verify packaged runtime
        run: pnpm run package:desktop:win:x64 -- --unsigned --hosted-unsigned --build-version ${{ steps.settings.outputs.version }}
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-hosted-unsigned-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify one unsigned installer and record its digest
        if: success()
        id: installer
        run: |
          $files = @(Get-ChildItem -LiteralPath 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts' -Filter '*-unsigned.exe' -File)
          if ($files.Count -ne 1) { throw "Expected exactly one unsigned installer, found $($files.Count)" }
          $file = $files[0]
          $sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "path=$($file.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($file.Name)" >> $env:GITHUB_OUTPUT
          "size_bytes=$($file.Length)" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
          @(
            '## Hosted unsigned installer',
            '',
            "- Source ref: $env:PACKAGE_SOURCE_REF",
            "- File: $($file.Name)",
            "- Size: $($file.Length) bytes",
            "- SHA256: `$sha256`"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Retain verified unsigned installer
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-hosted-unsigned-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14
