- id: typert-loader
  config:
    # The Runtime is loaded underneath this bundle rather than as a top-level
    # Loader entry, so the Host must explicitly register its generated Remote.
    packages:
      - '@deepseek-ai/dsh-experimental-enterprise-runtime'

- insert:
    - id: enterprise-runtime
      name: '@deepseek-ai/dsh-experimental-enterprise-runtime'
      config:
        storageDir: .enterprise-runtime
    # The client contribution appears beneath this bundle's Plugin Manager
    # sidebar detail page and never exposes a provider or ZIP payload.
    - id: ui-enterprise-runtime
      name: '@deepseek-ai/dsh-experimental-client-ui-enterprise-runtime'
