[project]
name = "dsh-data-sources-mcp"
version = "0.1.0"
description = "Credential-free stdio MCP data-plane for the DSH data-sources broker"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.4.1",
  "mcp==1.25.0",
]

[project.scripts]
dsh-data-sources-mcp = "dsh_data_sources_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_data_sources_mcp"]
